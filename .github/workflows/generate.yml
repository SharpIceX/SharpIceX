name: 更新 Github 卡片

on:
    schedule:
        - cron: '0 21 * * *'
    workflow_dispatch:

jobs:
    generate:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: 迁出代码
              uses: actions/checkout@v7

            - name: 生成语言卡片
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: top-langs
                  options: username=${{ github.repository_owner }}&hide_border=true&layout=compact&langs_count=10&theme=radical&card_width=350&hide=ejs&exclude_repo=End,kernel_huawei_hi3660_lon_hm
                  path: generate/language.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: 提交变更
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@users.noreply.github.com"
                  git add generate/language.svg
                  if ! git diff --quiet HEAD -- generate/language.svg; then
                    git commit -m "Update README cards"
                    git push
                  else
                    echo "No changes in cards. Skipping commit."
                  fi
